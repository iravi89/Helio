<title>Helio Solar Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: operations console. Fixed ink sidebar, sun-amber accent for energy, status colours carry state. */
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --surface-2:#EAF0F2; --ink:#12222A; --muted:#5A6B74; --line:#D9E2E6;
  --side:#0F2A33; --side-ink:#C9D9DE; --side-hi:#FFFFFF; --side-line:#1E3D48;
  --accent:#E9A100; --accent-soft:#FCEFC9; --accent-ink:#7A5200; --brand:#0E6A7A; --brand-soft:#D7EDF0;
  --ok:#17905F; --ok-soft:#DDF3E8; --warn:#C27A00; --warn-soft:#FBEBCB; --bad:#C93C3C; --bad-soft:#F8DEDE; --off:#7D8E97; --off-soft:#E6ECEF;
  --shadow:0 1px 2px rgba(18,34,42,.06),0 4px 16px rgba(18,34,42,.05);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1418; --surface:#111E24; --surface-2:#172830; --ink:#E4EDF0; --muted:#93A6AF; --line:#22363F;
  --side:#08181E; --side-ink:#A9BEC5; --side-hi:#FFFFFF; --side-line:#173039;
  --accent:#F4B323; --accent-soft:#3A2E10; --accent-ink:#F7CD6A; --brand:#4FB7C6; --brand-soft:#123843;
  --ok:#3CC08A; --ok-soft:#123528; --warn:#E9A23B; --warn-soft:#3A2B10; --bad:#EE6B6B; --bad-soft:#3D1A1C; --off:#8FA1AA; --off-soft:#1D2D35;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1418; --surface:#111E24; --surface-2:#172830; --ink:#E4EDF0; --muted:#93A6AF; --line:#22363F;
  --side:#08181E; --side-ink:#A9BEC5; --side-hi:#FFFFFF; --side-line:#173039;
  --accent:#F4B323; --accent-soft:#3A2E10; --accent-ink:#F7CD6A; --brand:#4FB7C6; --brand-soft:#123843;
  --ok:#3CC08A; --ok-soft:#123528; --warn:#E9A23B; --warn-soft:#3A2B10; --bad:#EE6B6B; --bad-soft:#3D1A1C; --off:#8FA1AA; --off-soft:#1D2D35;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem} h2{font-size:1.15rem} h3{font-size:1rem}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;color:var(--side-hi);font-family:var(--f-display);font-weight:700;font-size:1.1rem;padding:0 6px}
.logo svg{flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--side-ink);font-weight:500}
.nav button:hover{background:var(--side-line);color:var(--side-hi)}
.nav button[aria-current="page"]{background:var(--side-line);color:var(--side-hi);box-shadow:inset 3px 0 0 var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .count{margin-left:auto;font-family:var(--f-mono);font-size:.75rem;background:var(--bad);color:#fff;border-radius:10px;padding:0 7px}
.nav-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;padding:10px 10px 4px;opacity:.6}
.me-card{margin-top:auto;border:1px solid var(--side-line);border-radius:10px;padding:12px;font-size:.82rem;display:grid;gap:4px}
.me-card b{color:var(--side-hi)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding:10px 24px;flex-wrap:wrap}
.search{flex:1 1 220px;position:relative;min-width:0}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-results{position:absolute;top:110%;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:300px;overflow:auto;z-index:20}
.search-results button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;width:100%;box-sizing:border-box;padding:8px 12px}
.search-results button:hover,.search-results button:focus-visible{background:var(--surface-2)}
.persona{display:flex;align-items:center;gap:8px;font-size:.82rem}
.persona select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:260px}
.content{padding:22px 24px 48px;display:grid;gap:18px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head p{margin:4px 0 0}
.proto-note{font-size:.78rem;color:var(--accent-ink);background:var(--accent-soft);padding:4px 10px;border-radius:20px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:grid;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font-family:var(--f-body);font-size:.8rem;font-weight:500;color:var(--muted);margin-left:3px}
.kpi .d{font-size:.78rem;color:var(--muted)}
.up{color:var(--ok)} .down{color:var(--bad)}

.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th.sortable{cursor:pointer} th.sortable:hover{color:var(--ink)}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.site-name{font-weight:600} .sub{font-size:.76rem;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.plain::before{display:none}
.s-online{color:var(--ok);background:var(--ok-soft)} .s-degraded{color:var(--warn);background:var(--warn-soft)}
.s-offline{color:var(--bad);background:var(--bad-soft)} .s-comms{color:var(--off);background:var(--off-soft)}
.sev-critical{color:var(--bad);background:var(--bad-soft)} .sev-major{color:var(--warn);background:var(--warn-soft)} .sev-minor{color:var(--off);background:var(--off-soft)}
.role{color:var(--brand);background:var(--brand-soft)}
.tag{display:inline-block;font-size:.74rem;padding:1px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);margin:1px 2px 1px 0}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:.86rem}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.accent{background:var(--accent);color:#2A1B00;border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input,.field input,.field select,.field textarea{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:.84rem;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap;font-size:.84rem}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.status-bars{display:grid;gap:10px}
.sb-row{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:.84rem}
.sb-track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.sb-fill{height:100%;border-radius:5px}

.locked{display:grid;place-items:center;text-align:center;padding:48px 16px;gap:8px;color:var(--muted)}
.locked svg{color:var(--off)}
.hint{font-size:.8rem;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px 12px}

.drawer-bg{position:fixed;inset:0;background:rgba(8,18,22,.35);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:31;overflow:auto;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));display:grid;gap:16px;align-content:start;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.field{display:grid;gap:5px;font-size:.84rem}
.field label{font-weight:600}
.checks{display:grid;gap:6px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.checks label{display:flex;gap:8px;align-items:center;font-weight:400}
.perm-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;font-size:.82rem}
.perm-list span{display:flex;gap:6px;align-items:center}
.yes{color:var(--ok)} .no{color:var(--off)}
.matrix td.c,.matrix th.c{text-align:center}
.matrix input{width:16px;height:16px;accent-color:var(--brand)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--brand)}
.card .meta{display:flex;gap:14px;font-size:.8rem;color:var(--muted)}
.card .meta b{color:var(--ink);font-family:var(--f-mono)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.86rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.form{display:grid;gap:16px}
.form-grid .field{align-content:start}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.form-grid .wide{grid-column:1/-1}
.field input:not([type=checkbox]):not([type=radio]),.field select,.field textarea{width:100%}
.field textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);resize:vertical}
.field input:disabled{background:var(--surface-2);color:var(--muted)}
.unit{display:flex;align-items:stretch}
.unit input{border-top-right-radius:0!important;border-bottom-right-radius:0!important;min-width:0}
.unit span{display:flex;align-items:center;padding:0 10px;border:1px solid var(--line);border-left:0;border-radius:0 8px 8px 0;background:var(--surface-2);color:var(--muted);font-size:.8rem;white-space:nowrap}
.check-row{display:flex;gap:8px;align-items:center;grid-column:1/-1}
.stepper{list-style:none;margin:0;padding:0;display:flex;gap:4px;overflow-x:auto}
.stepper li{flex:1 0 auto}
.stepper button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:.84rem;color:var(--muted);font-weight:500;white-space:nowrap;width:100%;box-sizing:border-box}
.stepper button:hover{background:var(--surface-2)}
.stepper button:focus-visible{outline:2px solid var(--accent)}
.stepper .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-family:var(--f-mono);font-size:.75rem;flex:none}
.stepper button[aria-current="step"]{color:var(--ink);background:var(--surface)}
.stepper button[aria-current="step"] .dot{background:var(--accent);border-color:var(--accent);color:#2A1B00}
.stepper button.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.form-foot{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:14px;flex-wrap:wrap}
.choice{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.opt{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:4px;cursor:pointer;align-content:start}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt:focus-within{outline:2px solid var(--accent)}
.notice{border-radius:8px;padding:10px 14px;font-size:.86rem}
.notice ul{margin:4px 0 0;padding-left:18px}
.notice.bad{background:var(--bad-soft);color:var(--ink);border:1px solid var(--bad)}
.notice.warn{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
table.edit td{padding:5px 6px}
table.edit input{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.rev-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rev{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
@media (max-width:1100px){.choice{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.form-grid,.rev-grid,.choice{grid-template-columns:minmax(0,1fr)}}
.mobile-only{display:none}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;font-size:.86rem;box-shadow:var(--shadow)}
.back{all:unset;cursor:pointer;color:var(--muted);font-size:.84rem}
.back:hover{color:var(--ink)}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.inv{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:3px;font-size:.8rem}
.inv b{font-family:var(--f-mono);font-size:.95rem}
.inv.bad{border-color:var(--bad);background:var(--bad-soft)}
.inv.warn{border-color:var(--warn);background:var(--warn-soft)}

.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--bg)}
.login-art{background:var(--side);color:var(--side-ink);padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;position:relative;overflow:hidden}
.login-art h1{color:var(--side-hi);font-size:2.4rem;max-width:14ch;line-height:1.05}
.login-art canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.login-art > *{position:relative}
.login-form{padding:48px 32px;display:grid;align-content:center;gap:16px;max-width:460px;width:100%;justify-self:center}
.personas{display:grid;gap:8px}
.personas button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;background:var(--surface)}
.personas button:hover,.personas button:focus-visible{border-color:var(--brand)}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.g-3-1{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding:12px 16px;gap:10px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav button{white-space:nowrap;padding:7px 10px}
  .nav-label,.me-card{display:none}
  .mobile-only{display:inline-flex}
  .top{padding:10px 16px}
  .content{padding:16px 16px 40px}
  .g-2{grid-template-columns:minmax(0,1fr)}
  .login{grid-template-columns:minmax(0,1fr)}
  .login-art{padding:28px 20px}
  .login-art h1{font-size:1.8rem}
  .login-form{padding:24px 16px}
}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.perm-list{grid-template-columns:minmax(0,1fr)}}
.brief{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.brief p{margin:2px 0}.brief-ic{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink)}
.link{all:unset;cursor:pointer;color:var(--brand);font-weight:600;font-size:.86rem;margin-top:6px;display:inline-block}.link:focus-visible{outline:2px solid var(--accent)}
.sub-card{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;padding:10px 14px;margin-bottom:16px}.sub-card.due{border-left-color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.kpis-4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))!important;margin-bottom:16px}
.seg-wide{display:flex;width:100%;overflow-x:auto}.seg-wide button{flex:1 0 auto;text-align:center}
.diag{margin-top:10px}.diag text{fill:var(--ink)}.diag .dg-lab{font-size:12px;font-weight:700;letter-spacing:.06em}.diag .dg-val{font-size:20px;font-weight:700;font-family:var(--f-mono)}.diag .dg-big{font-size:40px;font-weight:700;font-family:var(--f-mono)}.diag text.dg-sub{font-size:11.5px;fill:var(--muted)}
.flow-line{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}.flow-line.rev{animation-direction:reverse}@keyframes flow{to{stroke-dashoffset:-28}}
.cond{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;display:grid;gap:10px}.cond-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.cond-row>div{background:var(--surface-2);border-radius:8px;padding:8px 10px;display:grid}.est{font-size:.65rem;font-weight:700;background:var(--line);border-radius:4px;padding:0 4px;text-transform:uppercase}
.vs{display:grid;gap:2px;border-radius:8px;padding:10px 12px;background:var(--surface-2);border-left:4px solid var(--off)}.vs.up{border-left-color:var(--ok)}.vs.down{border-left-color:var(--bad)}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}.key{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:.82rem;padding:3px 10px;border:1px solid var(--line);border-radius:99px}.key i{width:10px;height:10px;border-radius:3px;display:inline-block}.key[aria-pressed="false"]{opacity:.45;text-decoration:line-through}.key.static{cursor:default}.key:focus-visible{outline:2px solid var(--accent)}

/* ---------- Charts ---------- */
function niceMax(v){if(v<=0)return 1;const p=10**Math.floor(Math.log10(v)),n=v/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function barLine(points,{fmt=fmtE,h=230}={}){
  const W=760,H=h,L=64,Rr=12,T=14,B=28,iw=W-L-Rr,ih=H-T-B;
  const max=niceMax(Math.max(...points.map(p=>Math.max(p.a||0,p.b||0))));
  const bw=iw/points.length;let g="";
  for(let i=0;i<=4;i++){const y=T+ih-ih*i/4;g+=`<line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y+3}" text-anchor="end">${fmt(max*i/4)}</text>`}
  points.forEach((p,i)=>{const x=L+i*bw+bw*.18,w=bw*.64,hh=(p.a||0)/max*ih;
    g+=`<rect x="${x.toFixed(1)}" y="${(T+ih-hh).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(hh,0).toFixed(1)}" rx="2" fill="${p.gap?"var(--off-soft)":"var(--accent)"}"><title>${p.label}: ${fmt(p.a)} actual, ${fmt(p.b)} expected</title></rect>`;
    const st=Math.ceil(points.length/8);if(i%st===0||(i===points.length-1&&i%st>=st/2))g+=`<text x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${p.label}</text>`});
  const line=points.map((p,i)=>`${i?"L":"M"}${(L+i*bw+bw/2).toFixed(1)},${(T+ih-p.b/max*ih).toFixed(1)}`).join("");

function intraday(s){

  const pts=[];for(let t=5;t<=19;t+=.25){const x=(t-6)/12.5;const ex=x<0||x>1?0:s.cap*.86*Math.sin(Math.PI*x)*wf;
    const live=!(s.status==="offline"||s.status==="comms");const ac=t<=NOW_H&&live?ex*(s.pr/.8)*(0.93+rr()*.1):null;pts.push({t,ex,ac})}
  const max=niceMax(s.cap*.9);const X=t=>L+(t-5)/14*iw,Y=v=>T+ih-v/max*ih;let g="";
  for(let i=0;i<=4;i++){const y=T+ih-ih*i/4;g+=`<line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-8}" y="${y+3}" text-anchor="end">${fmtP(max*i/4)}</text>`}
  for(let t=6;t<=18;t+=2)g+=`<text x="${X(t)}" y="${H-8}" text-anchor="middle">${String(t).padStart(2,"0")}:00</text>`;
  g+=`<path d="${pts.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(p.ex).toFixed(1)}`).join("")}" fill="none" stroke="var(--brand)" stroke-width="2" stroke-dasharray="5 4"/>`;
  const a=pts.filter(p=>p.ac!=null);
  if(a.length){const d=a.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(p.ac).toFixed(1)}`).join("");
    g+=`<path d="${d}L${X(a[a.length-1].t)},${T+ih}L${X(a[0].t)},${T+ih}Z" fill="var(--accent)" opacity=".22"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
    const l=a[a.length-1];g+=`<circle cx="${X(l.t)}" cy="${Y(l.ac)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`}
  g+=`<line x1="${X(NOW_H)}" x2="${X(NOW_H)}" y1="${T}" y2="${T+ih}" stroke="var(--muted)" stroke-dasharray="2 3"/><text x="${X(NOW_H)+4}" y="${T+10}">now 14:30</text>`;
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Power today">${g}</svg>`;
}
function siteMap(sites){
  const W=520,H=560,minLat=7.5,maxLat=32,minLng=68,maxLng=93;
  const X=l=>20+(l-minLng)/(maxLng-minLng)*(W-40),Y=l=>20+(maxLat-l)/(maxLat-minLat)*(H-40);
  const col={online:"var(--ok)",degraded:"var(--warn)",offline:"var(--bad)",comms:"var(--off)"};
  let g=`<rect x="0" y="0" width="${W}" height="${H}" fill="var(--surface-2)" rx="10"/>`;
  for(let la=10;la<=30;la+=5)g+=`<line x1="12" x2="${W-12}" y1="${Y(la)}" y2="${Y(la)}" stroke="var(--line)"/><text x="16" y="${Y(la)-4}">${la}°N</text>`;
  for(let ln=70;ln<=90;ln+=5)g+=`<line y1="12" y2="${H-12}" x1="${X(ln)}" x2="${X(ln)}" stroke="var(--line)"/><text x="${X(ln)+3}" y="${H-16}">${ln}°E</text>`;
  [...sites].sort((a,b)=>(a.status==="online")-(b.status==="online")).reverse().forEach(s=>{
    g+=`<circle cx="${X(s.lng).toFixed(1)}" cy="${Y(s.lat).toFixed(1)}" r="${(2.5+Math.sqrt(s.cap)/12).toFixed(1)}" fill="${col[s.status]}" fill-opacity=".7" stroke="var(--surface)" stroke-width=".8" data-site="${s.id}" style="cursor:pointer"><title>${esc(s.name)} · ${fmtCap(s.cap)} · ${STATUS_LABEL[s.status]}</title></circle>`});

}

function inverters(s){

function reportRows(){
  const r=state.rep;let sites=scope();if(r.scope!=="all"){const g=SG.find(x=>x.id===r.scope);sites=sites.filter(s=>g.sites.includes(s.id))}
  const key={customer:s=>s.customer,region:s=>s.region,type:s=>s.type,site:s=>s.name}[r.by];const groups={};
  sites.forEach(s=>{(groups[key(s)]=groups[key(s)]||[]).push(s)});
  return{sites,rows:Object.entries(groups).map(([k,ss])=>{const e=ss.reduce((a,s)=>a+sumE(s,r.period),0),x=ss.reduce((a,s)=>a+sumX(s,r.period),0);
    return{k,n:ss.length,cap:ss.reduce((a,s)=>a+s.cap,0),e,x,pr:x?e/x*.8:0,av:ss.reduce((a,s)=>a+availOf(s,r.period),0)/ss.length,rev:ss.reduce((a,s)=>a+sumE(s,r.period)*s.tariff,0)}}).sort((a,b)=>b.e-a.e)};
}
function vReports(){

  const pts=DAYS.slice(30-r.period).map((d,j)=>{const i=30-r.period+j;return{label:dlabel(d),a:sites.reduce((a,s)=>a+(s.daily[i].e||0),0),b:sites.reduce((a,s)=>a+s.daily[i].exp,0)}});

    <div class="seg" role="group" aria-label="Period">${[[7,"7 days"],[14,"14 days"],[30,"30 days"]].map(([k,l])=>`<button data-period="${k}" aria-pressed="${r.period===k}">${l}</button>`).join("")}</div>
    <div class="seg" role="group" aria-label="Group by">${[["customer","Customer"],["region","Region"],["type","Plant type"],["site","Site"]].map(([k,l])=>`<button data-by="${k}" aria-pressed="${r.by===k}">${l}</button>`).join("")}</div>
  </div></section>
  <div class="kpis">
    <div class="kpi"><span class="eyebrow">Energy</span><span class="v num">${fmtE(tot.e)}</span><span class="d">${(tot.e/tot.cap/r.period).toFixed(2)} kWh/kWp/day</span></div>
    <div class="kpi"><span class="eyebrow">Expected</span><span class="v num">${fmtE(tot.x)}</span><span class="d ${tot.e>=tot.x?"up":"down"}">${tot.e>=tot.x?"+":"−"}${pct(Math.abs(tot.e/tot.x-1))} variance</span></div>
    <div class="kpi"><span class="eyebrow">Performance ratio</span><span class="v num">${pct(tot.e/tot.x*.8)}</span><span class="d">weather-adjusted</span></div>
    <div class="kpi"><span class="eyebrow">CO₂ avoided</span><span class="v num">${(tot.e*CO2/1000).toFixed(0)}<small>t</small></span><span class="d">0.716 kg/kWh grid factor</span></div>
    ${fin?`<div class="kpi"><span class="eyebrow">Revenue</span><span class="v num">${fmtINR(tot.rev)}</span><span class="d">avg ₹${(tot.rev/tot.e).toFixed(2)}/kWh</span></div>`:`<div class="kpi"><span class="eyebrow">Homes powered</span><span class="v num">${Math.round(tot.e/ (90*r.period/30)).toLocaleString("en-IN")}</span><span class="d">at 90 kWh/month</span></div>`}
    <div class="kpi"><span class="eyebrow">Capacity</span><span class="v num">${fmtCap(tot.cap)}</span><span class="d">${sites.length} sites</span></div>
  </div>
  <section class="panel"><div class="panel-head"><h2>Daily energy vs expected</h2><div class="legend"><span><i style="background:var(--accent)"></i>Actual</span><span><i style="background:var(--brand)"></i>Expected</span></div></div>${barLine(pts)}</section>
  <section class="panel"><div class="panel-head"><h2>By ${{customer:"customer",region:"region",type:"plant type",site:"site"}[r.by]}</h2>${r.by==="site"&&rows.length>40?`<span class="muted">Top 40 of ${rows.length} by energy</span>`:""}</div>

  ${shown.map(x=>`<tr><td class="site-name">${esc(x.k)}</td><td class="r num">${x.n}</td><td class="r num">${fmtCap(x.cap)}</td><td class="r num">${fmtE(x.e)}</td><td class="r num">${fmtE(x.x)}</td><td class="r num ${x.e>=x.x?"up":"down"}">${x.e>=x.x?"+":"−"}${pct(Math.abs(x.e/x.x-1))}</td><td class="r num">${pct(x.pr)}</td><td class="r num">${pct(x.av)}</td>${fin?`<td class="r num">${fmtINR(x.rev)}</td>`:""}</tr>`).join("")}
  </tbody></table></div>${exp?"":`<p class="hint" style="margin-top:12px">Export and scheduling are not part of the ${myRole().name} role.</p>`}</section>`;
}

function checkStep(d,step){
  const e=[],w=[];
  if(step==="basics"){if(!d.name.trim())e.push("Give the site a name.");else if(SITES.some(s=>s.name.toLowerCase()===d.name.trim().toLowerCase()&&s.id!==d.id))e.push("Another site already has this name.");
    if(!(d.lat>=6&&d.lat<=37&&d.lng>=68&&d.lng<=98))e.push("Coordinates must be inside India (lat 6–37, long 68–98).");}
  if(step==="plant"){if(!(+d.cap>0))e.push("Enter the DC capacity in kWp.");if(!(+d.acCap>0))e.push("Enter the AC capacity in kW.");
    const r=d.cap/d.acCap;if(+d.cap>0&&+d.acCap>0&&(r<1||r>1.5))w.push(`DC/AC ratio is ${r.toFixed(2)}. Most plants sit between 1.1 and 1.4.`);
    const mk=d.moduleCount*d.moduleWp/1000;if(d.moduleCount&&+d.cap>0&&Math.abs(mk/d.cap-1)>.03)w.push(`${d.moduleCount} modules × ${d.moduleWp} Wp = ${mk.toFixed(1)} kWp, which doesn't match the ${d.cap} kWp entered.`);}
  if(step==="data"){if(d.source==="vendor"&&!d.plantCode.trim())e.push("Enter the plant ID from the inverter maker's portal.");if(d.source==="vendor"&&!d.apiSaved&&!d.apiKey)e.push("Enter the API key so we can read data.");
    if(d.source==="modbus"&&!d.gateway.trim())e.push("Enter the gateway serial number.");if(!d.tested&&d.source!=="csv")w.push("Connection not tested yet.");}
  if(step==="devices"){if(!d.inverters.length&&d.source!=="csv")e.push("Add at least one inverter, or use Test connection to find them.");
    const sum=d.inverters.reduce((a,v)=>a+(+v.kw||0),0);if(d.inverters.length&&+d.acCap>0&&Math.abs(sum/d.acCap-1)>.05)w.push(`Inverters add up to ${sum} kW but the AC capacity is ${d.acCap} kW.`);
    if(new Set(d.inverters.map(v=>v.name)).size!==d.inverters.length)e.push("Two inverters share a name.");}
  if(step==="targets"){if(!(d.targetPR>=50&&d.targetPR<=95))e.push("Target PR should be between 50% and 95%.");}
  return{e,w};
}

function applyDraftToSite(d,s){
  const before={customer:s.customer,region:s.region};
  Object.assign(s,{name:d.name.trim(),customer:d.customer,type:d.type,city:d.city,state:d.state,region:d.region,lat:+d.lat,lng:+d.lng,cap:+d.cap,commissioned:new Date(d.commissioned),inv:Math.max(1,d.inverters.length)});
  if(can("view_financials"))s.tariff=+d.tariff;
  const{id,isNew,name,customer,type,city,state:st,region,lat,lng,commissioned,cap,tariff,groups,apiKey,tested,...cfg}=d;
  if(apiKey)cfg.apiSaved=true;s.cfg=cfg;
  SG.forEach(g=>{const want=g.kind==="Customer"?g.name===s.customer:g.kind==="Region"?g.id==="SG-R-"+s.region:g.id==="SG-X1"?s.cap>=1000:g.id==="SG-X2"?s.commissioned.getFullYear()===2026:groups.includes(g.id);
    const has=g.sites.includes(s.id);if(want&&!has)g.sites.push(s.id);if(!want&&has)g.sites.splice(g.sites.indexOf(s.id),1)});
  scopeCache=null;return before;
}
function createSite(d){

/* ---------- Added after the io.Nest walkthrough: multi-source sites, live views, logger, tickets, renewals, account ---------- */
const SUN={rise:6.25,set:18.1};
const fmtKW=kw=>kw==null?"–":Math.abs(kw)>=1000?(kw/1000).toFixed(2)+" MW":Math.abs(kw)>=100?Math.round(kw)+" kW":(+kw).toFixed(1)+" kW";
const TREES_PER_T=25.6; // trees a year to absorb one tonne of CO₂
const SRC={solar:["Solar","var(--accent)"],grid:["Grid","var(--brand)"],dg:["Diesel","var(--bad)"],load:["Site load","var(--ink)"]};
function ext(s){
  if(s._x)return s._x;const r=mulberry32(s.idx*211+5);
  const exportOnly=s.type==="Ground-mount"||s.type==="Floating",hasDG=!exportOnly&&r()<.38,hasMeter=exportOnly||r()<.82;
  const base=exportOnly?0:s.cap*(.45+r()*.9),dgOn=hasDG&&r()<.2,live=!(s.status==="offline"||s.status==="comms");
  const solar=live?s.nowKW:0,load=exportOnly?0:base*(.85+r()*.3);
  let grid,dg=0;if(exportOnly)grid=-solar;else if(dgOn){dg=Math.max(load-solar,0);grid=0}else grid=load-solar;
  const wf=WF[s.region].today,sun=Math.max(0,Math.sin(Math.PI*(NOW_H-6)/12.5));
  const irr=Math.round(1000*sun*wf*(.92+r()*.1)),cloud=Math.round(clamp((1.05-wf)*160+r()*10,0,100));
  const temp=+({North:31,West:32,Central:33,South:30,East:29}[s.region]+r()*4).toFixed(1),hum=Math.round(35+r()*45),wind=+(4+r()*14).toFixed(1);
  const years=Math.max(.1,(TODAY-s.commissioned)/3.156e10),lifetime=s.cap*RY[s.region]*365*years*(s.pr/.8)*.97;
  const credit=s.daily.filter(d=>d.gap||d.e===0).length+Math.floor(r()*9);
  const ann=new Date(TODAY.getFullYear(),s.commissioned.getMonth(),s.commissioned.getDate());if(ann<=TODAY)ann.setFullYear(ann.getFullYear()+1);
  const renew=new Date(ann.getTime()+credit*864e5),served=Math.round((TODAY-new Date(ann.getTime()-365*864e5))/864e5);
  const fee=Math.round((12000+s.cap*140)/500)*500,dgTariff=+(21+r()*7).toFixed(2);
  return s._x={exportOnly,hasDG,hasMeter,base,dgOn,solar,load,grid,dg,irr,cloud,temp,hum,wind,lifetime,credit,renew,served,fee,dgTariff,paid:r()<.7,expNow:live||s.status==="offline"?s.cap*.86*sun*wf:0};
}
const solarShare=x=>x.exportOnly?null:x.load>0?clamp(x.solar/x.load,0,1):0;
const daysTo=d=>Math.round((d-TODAY)/864e5);
const dfmt=d=>d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});

/* Plain-language briefings, like io.Nest's assistant bubble */
function greeting(){return NOW_H<12?"Good morning":NOW_H<17?"Good afternoon":"Good evening"}
function briefing(lines,link){return`<div class="brief" role="status"><span class="brief-ic" aria-hidden="true">${svgI("spark",20)}</span><div>${lines.map(l=>`<p>${l}</p>`).join("")}${link||""}</div></div>`}
function overviewBrief(sc){
  const rep=sc.filter(s=>s.status!=="comms").length,nowKW=sc.reduce((a,s)=>a+s.nowKW,0),exp=sc.reduce((a,s)=>a+ext(s).expNow,0),tE=sc.reduce((a,s)=>a+(s.todayE||0),0);
  const val=sc.reduce((a,s)=>a+(s.todayE||0)*s.tariff,0),crit=ALARMS.filter(a=>a.state==="open"&&a.sev==="critical"&&sc.some(s=>s.id===a.site));

  l.push(crit.length?`<b>${crit.length} critical alarm${crit.length>1?"s":""}</b> need attention, the newest at ${esc(siteById(crit[0].site).name)}: ${esc(crit[0].type.toLowerCase())}.${off.length?` ${off.length} sites are offline or not sending data.`:""}`:"Nothing needs your attention — every site is sending data as expected.");

function siteBrief(s){

  if(s.status==="comms")l.push(`<b>${esc(s.name)}</b> has not sent data since ${s.lastSeen}. The datalogger or its internet link is the usual cause; the figures below are from the last reading.`);
  else if(s.status==="offline")l.push(`<b>${esc(s.name)}</b> is not generating, although the weather allows about ${fmtKW(x.expNow)}. ${ALARMS.some(a=>a.site===s.id&&a.state==="open")?"An alarm is open and the O&M team has been told.":""}`);

/* Day profile per source, 15-minute steps */
function dayProfile(s){
  const x=ext(s),wf=WF[s.region].today,rr=mulberry32(s.idx*97+3),live=!(s.status==="offline"||s.status==="comms"),out=[];
  for(let t=0;t<=NOW_H+1e-9;t+=.25){const u=(t-6)/12.5;const ex=u<0||u>1?0:s.cap*.86*Math.sin(Math.PI*u)*wf;const solar=live?ex*(s.pr/.8)*(.93+rr()*.1):0;
    const ci=t>=8.5&&t<=19?1:.55,load=x.exportOnly?0:x.base*ci*(.9+rr()*.2);
    const dg=x.hasDG&&((t>=7&&t<7.75)||(x.dgOn&&t>=13))?Math.max(load-solar,0):0,grid=x.exportOnly?-solar:dg>0?0:load-solar;out.push({t,ex,solar,grid,dg,load})}
  return out;
}
function energyHistory(s,range){
  const x=ext(s),rr=mulberry32(s.idx*53+range.length);
  const day=(e,ex,label,gap)=>{const load=x.exportOnly?0:x.base*(10.5+.55*13.5)*(.9+rr()*.2),dg=x.hasDG?load*(.02+rr()*.1):0;
    return{label,solar:e||0,exp:ex,gap,load,dg,grid:x.exportOnly?-(e||0):Math.max(load-(e||0)-dg,0)}};
  if(range==="week")return s.daily.slice(23).map((d,i)=>day(d.e,d.exp,DAYS[23+i].toLocaleDateString("en-IN",{weekday:"short"}),d.gap));
  if(range==="month")return s.daily.map((d,i)=>day(d.e,d.exp,dlabel(DAYS[i]),d.gap));
  const SEAS=[.86,.95,1.06,1.12,1.1,.92,.8,.82,.92,.97,.9,.83];
  return[...Array(12)].map((_,k)=>{const m=new Date(TODAY.getFullYear(),TODAY.getMonth()-11+k,1),dim=k===11?TODAY.getDate():new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
    const ex=s.cap*RY[s.region]*SEAS[m.getMonth()]*dim,before=m<new Date(s.commissioned.getFullYear(),s.commissioned.getMonth(),1);
    const r=day(before?0:ex*(s.pr/.8)*(.95+rr()*.08),ex,m.toLocaleDateString("en-IN",{month:"short"}),before);r.load*=dim;r.dg*=dim;r.grid=x.exportOnly?-r.solar:Math.max(r.load-r.solar-r.dg,0);return r});
}
function sourcesChart(s){
  const x=ext(s),rg=state.chartRange||"day",hide=state.hideSrc||{};const srcs=["solar",...(x.hasMeter?["grid"]:[]),...(x.hasDG?["dg"]:[])];
  const W=760,H=250,L=64,Rr=12,T=14,B=28,iw=W-L-Rr,ih=H-T-B;let g="",max,rows,cols;
  if(rg==="day"){

    const X=t=>L+t/24*iw,Y=v=>T+ih-Math.max(v,0)/max*ih;
    for(let i=0;i<=4;i++){const y=T+ih-ih*i/4;g+=`<line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-8}" y="${y+3}" text-anchor="end">${fmtP(max*i/4)}</text>`}
    for(let t=0;t<=24;t+=3)g+=`<text x="${X(t)}" y="${H-8}" text-anchor="middle">${String(t%24).padStart(2,"0")}:00</text>`;
    g+=`<path d="${rows.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(p.ex).toFixed(1)}`).join("")}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
    const ser={solar:p=>p.solar,grid:p=>Math.abs(p.grid),dg:p=>p.dg,load:p=>p.load};
    [...srcs,...(x.exportOnly?[]:["load"])].filter(k=>!hide[k]).forEach(k=>{const d=rows.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(ser[k](p)).toFixed(1)}`).join("");
      g+=k==="solar"?`<path d="${d}L${X(rows[rows.length-1].t)},${T+ih}L${X(rows[0].t)},${T+ih}Z" fill="var(--accent)" opacity=".18"/>`:"";
      g+=`<path d="${d}" fill="none" stroke="${SRC[k][1]}" stroke-width="${k==="load"?1.6:2.2}" ${k==="load"?'stroke-dasharray="1 3" stroke-linecap="round"':""}/>`});
    cols=["Time",...srcs.map(k=>SRC[k][0]+" kW"),...(x.exportOnly?[]:["Site load kW"])];
    rows=rows.filter((_,i)=>i%2===0).map(p=>[`${String(Math.floor(p.t)).padStart(2,"0")}:${String(Math.round(p.t%1*60)).padStart(2,"0")}`,...srcs.map(k=>(k==="grid"?p.grid:p[k]).toFixed(1)),...(x.exportOnly?[]:[p.load.toFixed(1)])]);
  }else{
    const pts=energyHistory(s,rg);const vis=srcs.filter(k=>!hide[k]);
    max=niceMax(Math.max(...pts.map(p=>Math.max(vis.reduce((a,k)=>a+Math.abs(p[k]),0),p.load,p.exp))));const bw=iw/pts.length;
    for(let i=0;i<=4;i++){const y=T+ih-ih*i/4;g+=`<line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-8}" y="${y+3}" text-anchor="end">${fmtE(max*i/4)}</text>`}
    pts.forEach((p,i)=>{let y0=T+ih;const xx=L+i*bw+bw*.16,w=bw*.68;vis.forEach(k=>{const h=Math.abs(p[k])/max*ih;y0-=h;g+=`<rect x="${xx.toFixed(1)}" y="${y0.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${p.gap&&k==="solar"?"var(--off-soft)":SRC[k][1]}" opacity="${k==="solar"?1:.8}"><title>${p.label} · ${SRC[k][0]} ${fmtE(Math.abs(p[k]))}</title></rect>`});
      const st=Math.ceil(pts.length/10);if(i%st===0)g+=`<text x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${p.label}</text>`});
    g+=`<path d="${pts.map((p,i)=>`${i?"L":"M"}${(L+i*bw+bw/2).toFixed(1)},${(T+ih-p.exp/max*ih).toFixed(1)}`).join("")}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
    cols=[rg==="year"?"Month":"Day",...srcs.map(k=>SRC[k][0]+(k==="grid"&&x.exportOnly?" export":"")+" kWh"),"Solar expected kWh"];
    rows=pts.map(p=>[p.label,...srcs.map(k=>Math.round(Math.abs(p[k])).toLocaleString("en-IN")),Math.round(p.exp).toLocaleString("en-IN")]);

  if(s.status==="comms")return`The datalogger at ${s.name} last reported ${s.lastSeen}. This is usually the internet link or power to the logger. An engineer has been asked to check it.`;
  if(s.status==="offline")return`${s.name} is producing nothing although the weather allows about ${fmtKW(x.expNow)}. ${al.length?`Open alarm: ${al[0].type} on ${al[0].device}.`:""} Escalated to the O&M team.`;
  if(cat.includes("low")||cat.includes("faulty")){const bad=inverters(s).filter(v=>v.st!=="ok");return bad.length?`${bad.length} inverter${bad.length>1?"s are":" is"} below the others: ${bad.map(v=>v.name).join(", ")}. ${al[0]?al[0].type+".":""} Escalated to the O&M team.`:`Output is ${pct(s.nowKW/(x.expNow||1))} of what today's weather allows and every inverter is within 10% of the others. Cloud cover is ${x.cloud}%, which explains most of the dip. If that does not match what you see, reply and we will send an engineer.`}
  return`${s.name} is reporting normally: last reading ${s.lastSeen}, ${fmtKW(s.nowKW)} now. Passed to the support team for a closer look.`;
}

  const r=state.rep,sc=scope(),s=siteById(r.site)&&sc.includes(siteById(r.site))?siteById(r.site):sc[0];if(!s)return{cols:[],rows:[],tot:[]};r.site=s.id;

      rows:h.map((p,i)=>[dlabel(DAYS[30-n+i]),Math.round(p.solar),Math.round(p.exp),p.gap?"no data":pct(p.solar/p.exp*.8),...(x.hasMeter?[Math.round(Math.abs(p.grid))]:[]),...(x.hasDG?[Math.round(p.dg)]:[]),...(fin?[fmtINR(p.solar*s.tariff)]:[])]),
      tot:[["Solar",fmtE(h.reduce((a,p)=>a+p.solar,0))],["Expected",fmtE(h.reduce((a,p)=>a+p.exp,0))],...(x.hasDG?[["Diesel",fmtE(h.reduce((a,p)=>a+p.dg,0))]]:[])]}}

  const d=dayProfile(s),step=r.interval==="60"?4:1,pts=d.filter((_,i)=>i%step===0),tm=p=>`${String(Math.floor(p.t)).padStart(2,"0")}:${String(Math.round(p.t%1*60)).padStart(2,"0")}`;
  if(r.type==="interval")return{s,title:"Interval readings, today",cols:["Time","Solar kW",...(x.hasMeter?["Grid kW"]:[]),...(x.hasDG?["Diesel kW"]:[]),...(x.exportOnly?[]:["Site load kW"])],

}

      navigator.clipboard.writeText(csv).then(()=>toast(`Copied ${rows.length} rows as CSV`)).catch(()=>toast("Clipboard is blocked here"))}else toast(`The ${d.dl==="pdf"?"PDF":"Excel file"} for ${s.name} would download here`);log("Exported report",`${s.id} ${state.rep.type}, ${rows.length} rows`);return}
  if(d.gres){document.getElementById("gresults").innerHTML="";return go("site",{siteId:d.gres})}
  if(d.site)return go("site",{siteId:d.site});
  if(d.statusjump)return go("sites",{sitesStatus:d.statusjump,page:0});
  if(d.sort){state.dir=state.sort===d.sort?-state.dir:1;state.sort=d.sort;return render()}
  if(d.page){state.page+=+d.page;render();return}
  if(d.alarmf){state.alarmF=d.alarmf;return render()}
  if(d.ack){const a=ALARMS.find(x=>x.id===d.ack);a.state="acknowledged";a.ackBy=me().name;log("Acknowledged alarm",`${a.id} ${a.type} at ${siteById(a.site).name}`);toast("Alarm acknowledged");return render()}
  if(d.period){state.rep.period=+d.period;return render()}
  if(d.by){state.rep.by=d.by;return render()}
  if(d.utab){state.userTab=d.utab;return render()}
  if(d.gtab){state.groupTab=d.gtab;return render()}
  if(d.user)return userDrawer(d.user);
  if(d.ug)return ugDrawer(d.ug);
  if(d.sg)return sgDrawer(d.sg);
  if(d.approve)return inviteDrawer(REQUESTS.find(r=>r.id===d.approve));
  if(d.reject){const i=REQUESTS.findIndex(r=>r.id===d.reject);log("Rejected registration",REQUESTS[i].email);REQUESTS.splice(i,1);toast("Request rejected");return render()}
  if(d.persona){state.me=d.persona;state.loggedIn=true;scopeCache=null;return go("overview",{sitesGroup:"all",rep:{...state.rep,scope:"all"},page:0})}
  if(d.saveuser){const u=USERS.find(x=>x.id===d.saveuser);const nr=document.getElementById("urole").value;const ng=[...document.querySelectorAll("[data-ugcheck]")].filter(c=>c.checked).map(c=>c.dataset.ugcheck);
    const keep=me().role==="platform_admin"?[]:u.groups.filter(g=>!document.querySelector(`[data-ugcheck="${g}"]`));
    if(nr!==u.role)log("Changed role",`${u.name}: ${roleById(u.role).name} → ${roleById(nr).name}`);u.role=nr;u.groups=[...keep,...ng];log("Updated groups",`${u.name}: ${u.groups.map(g=>UG.find(x=>x.id===g).name).join(", ")||"none"}`);
    scopeCache=null;closeDrawer();toast("Saved. Access updates on their next page load");return render()}
  if(d.suspend){const u=USERS.find(x=>x.id===d.suspend);u.status=u.status==="suspended"?"active":"suspended";log(u.status==="suspended"?"Suspended user":"Reactivated user",u.email);toast(u.status==="suspended"?"User suspended and signed out":"User reactivated");closeDrawer();return render()}
  if(d.resend){toast("Invite sent again");return}
  if(d.saveug){const g=UG.find(x=>x.id===d.saveug);g.siteGroups=[...document.querySelectorAll("[data-sgcheck]")].filter(c=>c.checked).map(c=>c.dataset.sgcheck);log("Changed group access",`${g.name}: ${g.siteGroups.length} site groups`);scopeCache=null;closeDrawer();toast("Group access saved");return render()}
  const a=d.action;
  if(a==="close")return closeDrawer();
  if(a==="logout"){state.loggedIn=false;return render()}
  if(a==="theme"){state.theme={auto:"light",light:"dark",dark:"auto"}[state.theme];applyTheme();toast({auto:"Theme follows sunrise and sunset",light:"Theme: always light",dark:"Theme: always dark"}[state.theme]);return render()}
  if(a==="account")return accountDrawer();
  if(a==="numbers"){state.showNums=!state.showNums;return render()}
  if(a==="invite")return inviteDrawer();
  if(a==="schedule")return scheduleDrawer();
  if(a==="request"){e.preventDefault();toast("The request form would open here");return}
  if(a==="newrole"){toast("New role form would open here");return}
  if(a==="copycsv"){const{rows}=reportRows();const csv=["Group,Sites,Capacity kWp,Energy kWh,Expected kWh,PR"+(can("view_financials")?",Revenue INR":""),...rows.map(x=>[`"${x.k}"`,x.n,x.cap,Math.round(x.e),Math.round(x.x),(x.pr*100).toFixed(1)+(can("view_financials")?","+Math.round(x.rev):"")].join(","))].join("\n");
    navigator.clipboard.writeText(csv).then(()=>toast(`Copied ${rows.length} rows`)).catch(()=>toast("Clipboard is blocked here"));log("Exported report",`${rows.length} rows`);return}
});
document.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="persona"){state.me=e.target.value;scopeCache=null;const v=state.view;return go(["users","groups","roles","audit","support","renewals","reports","alarms"].includes(v)?v:v==="site"?"overview":v,{sitesGroup:"all",rep:{...state.rep,scope:"all"},page:0})}
  if(id==="fstatus"){state.sitesStatus=e.target.value;state.page=0;return render()}
  if(id==="fregion"){state.sitesRegion=e.target.value;state.page=0;return render()}
  if(id==="ftype"){state.sitesType=e.target.value;state.page=0;return render()}
  if(id==="fgroup"){state.sitesGroup=e.target.value;state.page=0;return render()}
  if(id==="rscope"){state.rep.scope=e.target.value;return render()}
  if(id==="rsite"){state.rep.site=e.target.value;return render()}
  if(id==="rtype"){state.rep.type=e.target.value;return render()}
  if(e.target.dataset.param){const p=e.target.dataset.param,cur=state.rep.params.length?state.rep.params:["Activ_pow","Volt_R","Freq"];state.rep.params=e.target.checked?[...cur.filter(x=>x!==p),p]:cur.filter(x=>x!==p);if(!state.rep.params.length){state.rep.params=[p];toast("Keep at least one parameter")}return render()}
  if(id==="pwshow"){["pwcur","pwnew","pwnew2"].forEach(k=>document.getElementById(k).type=e.target.checked?"text":"password");return}
  if(e.target.dataset.perm){const[rid,p]=e.target.dataset.perm.split("|");const r=roleById(rid);r.perms=e.target.checked?[...r.perms,p]:r.perms.filter(x=>x!==p);log("Changed role permission",`${r.name}: ${e.target.checked?"granted":"removed"} "${PERMS.find(x=>x[0]===p)[1]}"`);toast("Role updated");if(rid===me().role)render()}
});
let typeT;
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="sq"||id==="uq"){clearTimeout(typeT);typeT=setTimeout(()=>{if(id==="sq"){state.sitesQ=e.target.value;state.page=0}else state.userQ=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById(id);el.focus();el.setSelectionRange(pos,pos)},180)}
  if(id==="pwnew"){document.getElementById("pwrules").innerHTML=pwRules(e.target.value).map(([ok,l])=>`<li class="${ok?"yes":""}">${l}</li>`).join("")}
  if(id==="gsearch"){const q=e.target.value.toLowerCase().trim();const box=document.getElementById("gresults");if(!q){box.innerHTML="";return}
    const hits=scope().filter(s=>(s.name+s.city+s.customer+s.id).toLowerCase().includes(q)).slice(0,8);
    box.innerHTML=`<div class="search-results">${hits.map(s=>`<button data-gres="${s.id}"><span>${esc(s.name)}<div class="sub">${s.city} · ${s.id}</div></span>${statusChip(s.status)}</button>`).join("")||'<div style="padding:10px 12px" class="muted">No sites in your access match.</div>'}</div>`}
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="ticketform"){const sub=document.getElementById("tsub").value.trim(),body=document.getElementById("tbody").value.trim(),sid=document.getElementById("tsite").value,cat=document.getElementById("tcat").value;
    if(!sub){toast("Please add a short subject");return}if(!body){toast("Please describe what is happening");return}
    const s=sid&&siteById(sid),t={id:"T-"+(1041+TICKETS.length),site:sid||null,cat,subject:sub,status:"open",by:me().id,when:"just now",msgs:[{who:me().name,text:body,when:"just now"},{who:"Automatic check",auto:true,text:s?autoCheck(s,cat):"Sent to an administrator, who will reply here.",when:"just now"}]};
    if(s&&s.status==="online"&&!cat.includes("faulty")&&!inverters(s).some(v=>v.st!=="ok"))t.status="answered";
    TICKETS.unshift(t);log("Raised ticket",`${t.id} ${sub}`);state.tickF="active";render();toast(t.status==="answered"?"Answered automatically":"Ticket raised");return ticketDrawer(t.id)}
  if(f.id==="renewform"){const s=siteById(f.dataset.id),x=ext(s),fee=+document.getElementById("rfee").value,tar=+document.getElementById("rtar").value,dg=+document.getElementById("rdg").value;
    if(!(fee>=0&&tar>0)){toast("Enter a fee and a tariff above zero");return}const ch=[];if(fee!==x.fee)ch.push(`fee ${fmtINR(x.fee)} → ${fmtINR(fee)}`);if(tar!==s.tariff)ch.push(`tariff ₹${s.tariff} → ₹${tar}`);if(x.hasDG&&dg!==x.dgTariff)ch.push(`diesel ₹${x.dgTariff} → ₹${dg}`);
    x.fee=fee;s.tariff=tar;if(x.hasDG)x.dgTariff=dg;log("Edited subscription",`${s.id} ${ch.join(", ")||"no changes"}`);closeDrawer();toast("Saved");return render()}
  if(f.id==="pwform"){const cur=document.getElementById("pwcur").value,nw=document.getElementById("pwnew").value,nw2=document.getElementById("pwnew2").value;
    if(!cur){toast("Enter your current password");return}if(pwRules(nw).some(r=>!r[0])){toast("The new password does not meet every rule yet");return}if(nw!==nw2){toast("The two new passwords do not match");return}
    log("Changed password",me().email);closeDrawer();toast("Password changed. Other sessions were signed out");return}
  if(f.id==="loginform"){toast("Pick a demo person to sign in");return}
  if(f.id==="schedform"){log("Scheduled report",document.getElementById("sfreq").value);closeDrawer();toast("Report scheduled");return}
  if(f.id==="inviteform"){const name=document.getElementById("iname").value.trim(),email=document.getElementById("iemail").value.trim();if(!name||!email)return;
    const groups=[...document.querySelectorAll("[data-igroup]")].filter(c=>c.checked).map(c=>c.dataset.igroup);
    if(!groups.length){toast("Pick at least one group so they can see some sites");return}
    USERS.push({id:"U"+(USERS.length+100),name,email,role:document.getElementById("irole").value,org:document.getElementById("iorg").value,groups,direct:[],status:"invited",mfa:false,last:"Never"});
    const rq=f.querySelector("[data-req]").dataset.req;if(rq){REQUESTS.splice(REQUESTS.findIndex(r=>r.id===rq),1);log("Approved registration",email)}else log("Invited user",email);
    closeDrawer();toast(rq?"Approved. Invite sent":"Invite sent");state.userTab="people";render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();if(e.key==="Enter"&&e.target.matches("tr.click"))e.target.click()});

function sfRender(focusId){const pos=document.activeElement&&document.activeElement.id;render();const el=document.getElementById(focusId||pos);if(el)el.focus()}
function genInverters(d){const ac=+d.acCap||Math.round((+d.cap||100)*.85);const models=INV_MODELS[d.vendor]||INV_MODELS[VENDORS[0]];const sizes=[50,100,215];
  const k=ac>=2000?2:ac>=300?1:0;const n=Math.max(1,Math.round(ac/sizes[k]));const kw=Math.round(ac/n);const pre=(d.vendor||"XX").slice(0,2).toUpperCase();
  return[...Array(n)].map((_,i)=>({name:"INV-"+String(i+1).padStart(2,"0"),make:(d.vendor||"").split(" ")[0],model:models[k],kw,serial:pre+String(1e9+Math.floor(Math.random()*9e9)).slice(0,10)}))}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-sfaction],[data-step]");if(!t)return;const d=state.draft;
  if(t.dataset.step){state.step=t.dataset.step;state.showErr=false;render();window.scrollTo(0,0);return}
  const a=t.dataset.sfaction;
  if(a==="new")return startNewSite();
  if(a==="bulk")return bulkDrawer();
  if(a==="edit")return startEditSite(state.siteId);
  if(a==="cancel")return go("sites");
  if(a==="prev"){state.step=STEPS[STEPS.findIndex(s=>s[0]===state.step)-1][0];state.showErr=false;render();window.scrollTo(0,0);return}
  if(a==="next"){if(checkStep(d,state.step).e.length){state.showErr=true;render();return}state.step=STEPS[STEPS.findIndex(s=>s[0]===state.step)+1][0];state.showErr=false;render();window.scrollTo(0,0);return}
  if(a==="test"){
    if(d.source==="vendor"&&(!d.plantCode.trim()||(!d.apiSaved&&!d.apiKey))){state.showErr=true;toast("Enter the plant ID and API key first");render();return}
    if(d.source==="modbus"&&!d.gateway.trim()){state.showErr=true;toast("Enter the gateway serial first");render();return}
    if(!d.inverters.length)d.inverters=genInverters(d);d.tested=true;toast(`Connected. Found ${d.inverters.length} inverters, last reading 2 min ago`);render();return}
  if(a==="addinv"){const last=d.inverters[d.inverters.length-1];d.inverters.push({name:"INV-"+String(d.inverters.length+1).padStart(2,"0"),make:last?last.make:"",model:last?last.model:"",kw:last?last.kw:"",serial:""});render();return}
  if(a==="copyinv"){const last=d.inverters[d.inverters.length-1];d.inverters.push({...last,name:"INV-"+String(d.inverters.length+1).padStart(2,"0"),serial:""});render();return}
  if(a==="delinv"){d.inverters.splice(+t.dataset.i,1);render();return}
  if(a==="create"){if(allIssues(d).some(x=>x.e.length))return;const s=createSite(d);log("Added site",`${s.id} ${s.name} (${fmtCap(s.cap)}, ${s.customer})`);state.draft=null;toast(`${s.name} added`);return go("site",{siteId:s.id})}
  if(a==="save"){const bad=allIssues(d).filter(x=>x.e.length);if(bad.length){state.step=bad[0].k;render();toast("Fix the items marked ! first");return}
    const s=siteById(d.id),old={name:s.name,cap:s.cap,tariff:s.tariff,customer:s.customer};applyDraftToSite(d,s);
    const ch=[];if(old.name!==s.name)ch.push(`name → ${s.name}`);if(old.cap!==s.cap)ch.push(`capacity ${old.cap} → ${s.cap} kWp`);if(old.tariff!==s.tariff)ch.push(`tariff ₹${old.tariff} → ₹${s.tariff}`);if(old.customer!==s.customer)ch.push(`customer → ${s.customer}`);
    log("Edited site",`${s.id} ${ch.join(", ")||"settings updated"}`);state.draft=null;toast("Site settings saved");return go("site",{siteId:s.id})}
  if(a==="archive"){const v=(document.getElementById("sf-confirm").value||"").trim();if(v!==d.id){toast(`Type ${d.id} to confirm`);return}
    const s=siteById(d.id);s.archived=true;scopeCache=null;log("Archived site",`${s.id} ${s.name}`);state.draft=null;toast(`${s.name} archived`);return go("sites")}
  if(a==="bulkcheck"||a==="bulkimport"){const rows=parseBulk(),bad=rows.filter(r=>r.errs.length);
    document.getElementById("bulkcheck").innerHTML=`<div class="notice ${bad.length?"bad":"warn"}" style="${bad.length?"":"background:var(--ok-soft);border-color:var(--ok)"}">${bad.length?`<b>${bad.length} of ${rows.length} rows need fixing</b><ul>${bad.map(r=>`<li>Row ${r.n}: ${esc(r.errs.join(", "))}</li>`).join("")}</ul>`:`<b>All ${rows.length} rows look good.</b>`}</div>`;
    if(a==="bulkimport"&&!bad.length&&rows.length){rows.forEach(r=>{const dd=draftFrom(null);Object.assign(dd,{name:r.name,customer:r.customer,type:r.type,city:r.c[0],state:r.c[1],region:r.c[2],lat:r.c[3],lng:r.c[4],cap:r.cap,acCap:r.ac});createSite(dd)});
      log("Imported sites",`${rows.length} sites from CSV`);closeDrawer();toast(`${rows.length} sites imported. Set up their data connections next`);state.sitesQ="";state.sort="name";render()}
    return}
});
function sfInput(e){
  const t=e.target,d=state.draft;if(!d)return;
  if(t.dataset.inv){const[i,f]=t.dataset.inv.split("|");d.inverters[+i][f]=f==="kw"?(t.value===""?"":+t.value):t.value;return}
  if(t.dataset.notify){d.notify=t.checked?[...d.notify,t.dataset.notify]:d.notify.filter(x=>x!==t.dataset.notify);return}
  if(t.dataset.sgroup){d.groups=t.checked?[...d.groups,t.dataset.sgroup]:d.groups.filter(x=>x!==t.dataset.sgroup);if(e.type==="change")sfRender();return}
  const p=t.dataset.f;if(!p)return;
  let v=t.type==="checkbox"?t.checked:t.type==="number"?(t.value===""?"":+t.value):t.value;setP(d,p,v);
  if(["plantCode","apiKey","gateway","vendor","source"].includes(p))d.tested=false;
  if(p==="cap"||p==="acCap"){const el=document.getElementById("dcac");if(el)el.textContent=+d.cap>0&&+d.acCap>0?(d.cap/d.acCap).toFixed(2):"–"}
  if(e.type==="change"&&t.hasAttribute("data-rr")){if(p==="city"){const c=CITIES.find(x=>x[0]===v);Object.assign(d,{state:c[1],region:c[2],lat:c[3],lng:c[4]})}sfRender(t.type==="radio"?null:t.id)}
}
document.addEventListener("input",sfInput);document.addEventListener("change",sfInput);
try{const t=localStorage.getItem("helio-theme");if(["auto","light","dark"].includes(t))state.theme=t}catch(e){}
applyTheme();setInterval(()=>{if(state.theme==="auto")applyTheme()},6e4);
render();
</script>
